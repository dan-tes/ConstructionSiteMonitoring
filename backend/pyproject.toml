[project]
name = "csm-backend"
version = "0.1.0"
description = "Construction Site Monitoring — FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "aio-pika>=10.0.1",
    "openpyxl>=3.1.5",
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
